# cave-home-cli — first-party manifest (no upstream port).
#
# `cavehomectl` is the advanced power-user CLI mandated by ADR-005 §2
# and the only sanctioned written-text surface that surfaces the
# cluster underneath the home-world UX (ADR-007). It has no upstream
# port — it is shaped by the cave-home Portal commands one-for-one
# so the OS image, Portal "Add node" wizard, and `cavehomectl` all
# call the same primitives.
#
# `port_method = "first-party"` therefore. `fill_ratio` and
# `test_port_ratio` are not meaningful (no upstream baseline); we
# emit a separate `subcommand_coverage` table that tracks how much
# of the documented surface is implemented vs. stubbed.

[crate]
name             = "cave-home-cli"
upstream_repo    = "none"
port_method      = "first-party"
upstream_license = "n/a"
ported_at        = "2026-05-25"
linux_min_kernel = "7.1"

[ratios]
# Not applicable; first-party. Reported as 1.0 by convention so the
# crate is not flagged as "incomplete" against the upstream-port
# pipeline. This is NOT a claim that the verbs work: real coverage is
# the subcommand_coverage table below (2026-10-26: 4 implemented,
# 1 partial, 36 not-connected of 41 top-level verbs).
fill_ratio              = 1.0
adr_justified_ratio = 1.00  # measured: every [[unmapped]]/[[scope_cut]] entry carries both priority and note
honest_ratio        = 1.00  # computed: fill / (fill + (1-fill)*(1-adr_justified))
fill_ratio_basis        = "first-party — no upstream port; coverage tracked via subcommand_coverage"
test_port_ratio         = 1.0

# ---- subcommand_coverage — implementation status per top-level verb ---------
#
# status values:
#   implemented    — does the real thing (local filesystem, real client, or
#                    a local computation that claims nothing about devices).
#   partial        — some sub-verbs reach a real client; the rest are
#                    not-connected.
#   not-connected  — no backend is wired into the CLI. The verb changes
#                    nothing, prints nothing on stdout, and exits 69
#                    (EX_UNAVAILABLE) with "henüz bağlı değil / not
#                    connected". Review finding Y5 (2026-10-19): these used
#                    to print demo data or "done" and exit 0.

[coverage_summary]
implemented   = 4
partial       = 1
not_connected = 36
total         = 41

[[subcommand_coverage]]
verb   = "init"
status = "implemented"
owner  = "F5"
note   = "Creates the local config dir + node marker."

[[subcommand_coverage]]
verb   = "destroy"
status = "implemented"
owner  = "F5"
note   = "Removes the local config dir after DESTROY confirmation."

[[subcommand_coverage]]
verb   = "get"
status = "implemented"
owner  = "F5"
note   = "Real HTTP GET of nodes/pods from the apiserver. Plain HTTP, no credentials: fails against a binary booted with authn + HTTPS by default (follow-up)."

[[subcommand_coverage]]
verb   = "jarvis"
status = "implemented"
owner  = "F5"
note   = "Local only: `ask` runs the real NLU fast-path as a dry run and says nothing was sent; `tools`/`wake` show local config."

[[subcommand_coverage]]
verb   = "unifi"
status = "partial"
owner  = "F2"
note   = "Real cave-home-unifi client: network devices/clients, protect cameras, access doors, live <view>, fingerprint (TOFU). Pinned TLS required (CAVEHOME_UNIFI_FINGERPRINT / CAVEHOME_ACCESS_FINGERPRINT) unless --insecure. Not connected: network status/block/unblock/outlet, protect status/events/seam, access status/events/unlock/lockdown, all of talk."

